[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mani_sim"
version = "0.1.0"
description = "robomimic 기반 Diffusion Policy 시뮬레이션 실험 (Data_Efficient_Improvement 연구용)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "diffusers==0.30.3",
    "einops==0.8.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy",
    "h5py",
    "huggingface_hub",
    "tqdm",
]

[project.optional-dependencies]
robomimic = [
    "robosuite==1.5.1",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0",
    "mujoco==3.2.3",  # requirements.txt 참고: robosuite 1.5.1의 mj_fullM 구 API 호환 상한
]
train = [
    "wandb>=0.24.2",
    "imageio>=2.37.3",
    "imageio-ffmpeg",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
    "matplotlib",
]
eval = [
    "imageio>=2.37.3",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
]

[tool.setuptools.packages.find]
where = ["src"]
