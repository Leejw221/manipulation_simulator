name: square_stage
env_name: NutAssemblySquare
robots: Panda
hdf5_path: data/robomimic/square/ph/v1.5/square/ph/square_image_v15.hdf5
camera_names: [agentview, robot0_eye_in_hand]
image_size: 84
rgb_keys: [agentview_image, robot0_eye_in_hand_image]
# stage_onehot: label_stages.py(구 label_square_stages.py)가 hdf5에 미리 기록해둔 7-dim
# one-hot(datasets/stage_labeler.py 7-stage). square_image.yaml과 이 필드 하나만 다르다.
lowdim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, stage_onehot]
obs_dims:
  robot0_eef_pos: 3
  robot0_eef_quat: 4
  robot0_gripper_qpos: 2
  stage_onehot: 7
action_dim: 7
use_online_stage_tracker: true
