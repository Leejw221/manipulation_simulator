name: transport_stage_online
env_name: TwoArmTransport
robots: [Panda, Panda]
# env_configuration: transport.yaml 참고(2026-07-21, robosuite 기본값과 달라 필수).
env_kwargs:
  env_configuration: single-arm-opposed
  lite_physics: false
  controller_configs:
    type: BASIC
    body_parts:
      right:
        type: OSC_POSE
        input_max: 1
        input_min: -1
        output_max: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5]
        output_min: [-0.05, -0.05, -0.05, -0.5, -0.5, -0.5]
        kp: 150
        damping: 1
        impedance_mode: fixed
        kp_limits: [0, 300]
        damping_limits: [0, 10]
        position_limits: null
        orientation_limits: null
        uncouple_pos_ori: true
        control_delta: true
        interpolation: null
        ramp_ratio: 0.2
        input_ref_frame: world
        gripper:
          type: GRIP
# transport_stage.yaml과 딱 hdf5_path만 다름(2026-07-21, train/eval stage 라벨 mismatch
# 판별 실험 — EXP-07 참고): stage_onehot을 offline label_stages_transport 대신
# OnlineStageTrackerTransport(rollout에 실제 쓰이는 causal estimator)로 재계산해 기록한
# 사본. train에서 본 라벨과 rollout에서 주입되는 라벨이 정의상 일치하게 만들어, 라벨
# 정확도가 stage-as-input null의 원인인지 격리해서 확인한다.
hdf5_path: data/transport_check/transport/ph/transport_image_v15_online_stage.hdf5
camera_names: [agentview, robot0_eye_in_hand, robot1_eye_in_hand]
image_size: 84
rgb_keys: [agentview_image, robot0_eye_in_hand_image, robot1_eye_in_hand_image]
lowdim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, robot1_eef_pos, robot1_eef_quat, robot1_gripper_qpos, stage_onehot]
obs_dims:
  robot0_eef_pos: 3
  robot0_eef_quat: 4
  robot0_gripper_qpos: 2
  robot1_eef_pos: 3
  robot1_eef_quat: 4
  robot1_gripper_qpos: 2
  stage_onehot: 5
action_dim: 14
use_online_stage_tracker: true
