# RoboCasa RestockBowls(long-horizon task, LHT) — vanilla(stage 없음) baseline.
# 데이터: robocasa/scripts/convert_restockbowls_to_zarr.py로 변환(105 episodes, 186,668
# steps). stage-conditioned 버전은 restockbowls_stage.yaml(이 파일과 num_stages 한 줄만
# 다름). 상세 배경: robocasa/research_design.md, HANDOFF.md A절.
name: restockbowls
dataset_backend: zarr
zarr_path: /home/moai/jungwook_ws/ljw_workspace/robocasa/data/restockbowls.zarr
env_backend: robocasa

camera_names: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
image_size: 84
rgb_keys: [robot0_agentview_left_image, robot0_agentview_right_image, robot0_eye_in_hand_image]
lowdim_keys: [state]

# obs_dims/action_dim: derive_task_meta_from_zarr가 학습 시작 시 zarr 배열 shape에서
# 다시 채워 덮어씀(hdf5 task와 동일 관례) — 여기 값은 초기 placeholder.
obs_dims:
  state: 16
action_dim: 12

# 학습 중 주기 평가(eval_every_epochs>0)는 diffusion_trainer.py의 _evaluate_robocasa()가
# robocasa/scripts/eval_rollout.py를 서브프로세스로 돌려서 처리한다(2026-08-06, EXP-01
# "학습 중 rollout eval 연동" — is_robocasa_task() 참고). 스모크 테스트·짧은 실험이면
# 여전히 eval_every_epochs=-1로 꺼도 됨(비용 절감).
