# 되집기 cube stack — 실물 "aliasing cube stack" 의 시뮬 재현. **vanilla(non-stage)**.
#
# task: 회색 큐브를 빨강 큐브 위에 쌓고, 그리퍼를 벌린 뒤 바로 다시 집어 원위치에 되돌리고
# 복귀한다. **첫 프레임과 마지막 프레임이 동일**한데(큐브 제자리·팔 홈) 그때 할 일은 정반대다
# — 시작에선 집으러 가야 하고 끝에선 멈춰야 한다. 관측이 아니라 이력에만 있는 정보다.
#
# 실물 결과: 일반 cube stack 20/20 · 되집기 non-stage 0/20 · 되집기 stage 18/20 (Fisher p=3.4e-9)
# 시뮬 검수 [실측 2026-08-31]: 첫/마지막 프레임 84px 차이 0.26%(무작위 쌍 4.11%),
#   aliasing 지수 1.35(global+wrist) — 기각선 0.45 위, 실물 2.08 아래(에피소드 길이 차 때문)
#
# stage 버전은 regrasp_stage.yaml — num_stages 한 줄만 다르고 zarr 는 공유한다.
# 데이터 생성: ~/claude/collect_regrasp.py -> ~/claude/stack_to_zarr.py --relabel none
name: regrasp
dataset_backend: zarr
zarr_path: /home/moai/jungwook_ws/ljw_workspace/robocasa/data/regrasp.zarr
env_backend: robosuite

camera_names: [agentview, robot0_eye_in_hand]
image_size: 84
rgb_keys: [global_image, wrist_image]
lowdim_keys: [state]

# obs_dims/action_dim 은 derive_task_meta_from_zarr 가 학습 시작 시 zarr shape 에서 덮어쓴다.
obs_dims:
  state: 11
action_dim: 10
