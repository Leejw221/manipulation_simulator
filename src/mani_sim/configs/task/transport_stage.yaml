name: transport_stage
env_name: TwoArmTransport
robots: [Panda, Panda]
hdf5_path: data/transport_check/transport/ph/transport_image_v15.hdf5
camera_names: [agentview, robot0_eye_in_hand, robot1_eye_in_hand]
image_size: 84
rgb_keys: [agentview_image, robot0_eye_in_hand_image, robot1_eye_in_hand_image]
# stage_onehot: label_stages.py(--task transport)가 hdf5에 미리 기록해둔 6-dim one-hot
# (datasets/stage_labeler.py의 label_stages_transport: lid_present/lid_removed/
# trash_delivered/payload_approach/payload_handoff/payload_delivered — 로봇0이 payload를 잡아
# 로봇1 쪽으로 옮기는 구간(payload_approach)과 로봇1이 넘겨받는 순간(payload_handoff)을 분리).
# transport.yaml과 이 필드 하나만 다르다. (라벨링 자체는 hdf5에 남아있는
# object/robot{0,1}_gripper_qpos로 계산 — 정책 입력엔 object를 안 주므로(픽셀만) stage_onehot이
# 픽셀에 없는 새 정보를 더함, Square의 image 실험과 동일 논리.)
lowdim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, robot1_eef_pos, robot1_eef_quat, robot1_gripper_qpos, stage_onehot]
obs_dims:
  robot0_eef_pos: 3
  robot0_eef_quat: 4
  robot0_gripper_qpos: 2
  robot1_eef_pos: 3
  robot1_eef_quat: 4
  robot1_gripper_qpos: 2
  stage_onehot: 6
action_dim: 14
use_online_stage_tracker: true
