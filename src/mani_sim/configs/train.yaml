defaults:
  - task: square
  - policy: diffusion_unet
  - _self_

# policy_name/runner_name = factory registry 키. policy.name(위 task/policy yaml의 name 필드)은
# 사람이 읽는 라벨일 뿐이고, 실제 어떤 클래스를 만들지는 이 둘이 정한다.
policy_name: diffusion
runner_name: diffusion_trainer

seed: 0
batch_size: 64
num_workers: 2
lr: 1.0e-4
weight_decay: 1.0e-6
num_epochs: 300
log_every: 50
ckpt_every_epochs: 25
# eval_every_epochs<=0 이면 학습 중 rollout 평가 생략(예: 빠른 스모크).
eval_every_epochs: 50
eval_episodes: 20
eval_max_steps: 300

# OpenVLA(runner_name=openvla_trainer) 전용 — DiffusionTrainer는 무시.
max_steps: 3000
grad_accumulation_steps: 8
save_every: 250

# 가중치 학습(옵션) — round.py가 배포+개입으로 모은 데이터(action_mode 라벨 포함)를 학습할 때
# 켠다. kind=null이면 기존처럼 비가중 BC/DiffusionPolicy. class_based=SIRIUS 원문 4-class 고정
# 가중치, action_error=예측오차 기반 적응 가중치, rabc=SARM 논문(arXiv:2509.25358)의
# Reward-Aligned BC(progress-delta 기반, task에 stage_onehot 라벨이 hdf5에 있어야 함,
# label_stages.py로 미리 기록) — 셋 다 reference 모델 없는 단순 가중 손실(losses/sirius_loss.py)
# 로 적용. APO(reference 모델+KTO)는 BC/DiffusionPolicy에 아직 미구현.
weighting:
  kind: null  # null | class_based | action_error | rabc | phase_rule | action_variance | event_radius
  target_intv: 0.5       # class_based 전용(SIRIUS 원문 기본값)
  target_preintv: 0.002  # class_based 전용
  beta_d: 1.0             # action_error 전용
  beta_u: 1.0
  gamma: 1.0
  kappa: auto              # rabc 전용 — "이미 충분히 좋은 진행" 임계값. "auto"면 이 데이터셋의
  # 실측 delta_mean으로 자동 설정(2026-07-22 수정, RABCWeight 참고) — 고정값 0.01(SARM 논문
  # 기본값)을 그대로 쓰면 episode 길이/chunk_size 비율이 다른 task에서 대부분 chunk가
  # weight=1로 포화돼 변별력을 잃음(Transport 실측: 76% 포화). 숫자를 직접 주면 그대로 씀.
  epsilon: 1.0e-6          # rabc 전용, 분모 안정화
  progress_path: null      # rabc 전용, null이면 heuristic stage_progress() 직접 계산.
  # scripts/compute_sarm_progress.py로 만든 npz 경로를 주면 학습된 SARM reward model의
  # 예측 progress를 씀(lerobot 실제 파이프라인과 동일 구조).
  critical_weight: 3.0     # phase_rule/event_radius 공용 — critical_stages(진입)에 곱할 가중치
  critical_stages: [3]     # phase_rule/event_radius 공용, Transport 기본값=payload_handoff(2026-07-21
  # trash_delivered 제거로 5단계로 축소되며 인덱스 4→3, STAGE_NAMES_TRANSPORT 참고)
  radius: 20               # event_radius 전용 — critical stage 진입 시점 ±radius 프레임만 가중치
  # (STAIR Eq.2 스타일. phase_rule은 critical stage 전체 구간에 가중치 — 이 둘을 별도 arm으로
  # 비교하기 위해 나눔, 2026-07-22)
  variance_path: null      # action_variance 전용 — scripts/compute_action_variance.py로 만든 npz 경로
  w_min: 0.2               # action_variance 전용, 가중치 clip 하한
  w_max: 5.0               # action_variance 전용, 가중치 clip 상한

resume: false
# manipulation_pipeline 컨벤션(outputs/<task>/<model>/<session>)을 그대로 따름 — <session>은
# 학습 시작 시각(2026-07-25 리팩터). resume=true로 이어가려면 이 output_dir을 그대로
# 다시 지정해야 한다(새로 실행하면 새 시각 폴더가 생겨 다른 세션이 됨 — 오늘 기본값을
# 새로 만들 때만 편하고 이어갈 땐 원래도 output_dir을 그대로 다시 줘야 했던 것과 동일한
# 부담, resume 자체가 새로 깨지는 건 아님).
output_dir: outputs/${task.name}/${policy.name}/${now:%Y%m%d-%H%M%S}
device: cuda
use_wandb: false
wandb_project: mani_sim

# hydra 자체 로그/설정 스냅샷(.hydra/)도 같은 폴더에 쌓아 체크포인트와 분리되지 않게 한다
# (전엔 outputs/<날짜>/<시각>/에 따로 생겼음 — hydra는 cwd는 안 바꾸므로(확인함, 2026-07-25)
# data/ 상대경로 등엔 영향 없음).
hydra:
  run:
    dir: ${output_dir}
