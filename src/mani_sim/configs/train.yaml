defaults:
  - task: square
  - policy: diffusion_unet
  - _self_

# policy_name/runner_name = factory registry 키. policy.name(위 task/policy yaml의 name 필드)은
# 사람이 읽는 라벨일 뿐이고, 실제 어떤 클래스를 만들지는 이 둘이 정한다.
policy_name: diffusion
runner_name: diffusion_trainer

seed: 0
batch_size: 64
num_workers: 2
lr: 1.0e-4              # system.kind=apo일 땐 이 값이 안 맞음(2026-07-27 밤 발견) - KTO류
                         # sigmoid 손실은 일반 diffusion MSE보다 손실 곡면이 훨씬 날카로워서,
                         # 이 LR(warmup 거쳐 1e-4까지 램프업)로는 초반 그래디언트 폭주로 sigmoid가
                         # 영구 포화되어 버림(실측: grad_norm이 수백에서 첫 스텝 이후 0으로 죽고
                         # 다시 안 살아남). Diffusion-KTO 논문(arXiv:2404.04465 Appendix A.1)도
                         # 1e-7(+warmup 1000step)을 씀 - system.kind=apo일 땐 round.yaml의
                         # train.apo_lr(예: 1e-6)로 명시적으로 낮춰서 override할 것.
weight_decay: 1.0e-6     # system.kind=apo일 땐 이 값도 작음(2026-07-28 발견, 원문 대조) -
                         # Diffusion-KTO 공식 코드(non-LoRA 경로)는 1e-2를 씀. LoRA로 대부분의
                         # 가중치를 얼려두는 APO 원문은 weight_decay 자체가 없음(순수 Adam,
                         # 인자 미지정) - "LoRA 없이 전체 파라미터 학습"이라는 우리 상황엔 참고할
                         # 원문이 Diffusion-KTO뿐이라 그 값을 따름. round.yaml의 train.apo_weight_decay로
                         # override할 것.
max_grad_norm: 1.0e9     # 사실상 클리핑 없음(측정만) - plain/SIRIUS 학습엔 지금까지 문제 없었음.
                         # system.kind=apo일 땐 Diffusion-KTO 공식 코드가 매 스텝 1.0으로 클리핑함
                         # (우리는 여태 이걸 안 걸어서 grad_norm이 300+까지 튀는 걸 그대로 통과시켰음,
                         # 2026-07-28 발견) - round.yaml의 train.apo_max_grad_norm으로 override할 것.
num_epochs: 300
log_every: 50
ckpt_every_epochs: 25
# eval_every_epochs<=0 이면 학습 중 rollout 평가 생략(예: 빠른 스모크).
eval_every_epochs: 50
eval_episodes: 10  # 2026-07-30: 20->10, round1 재학습 중간점검 비용 절감 목적으로 기본값 변경.
# round.yaml의 eval.max_steps는 이미 1000(2026-07-27, base policy 200회 실측 - 성공 에피소드
# 평균 길이 466, 범위 382~780 - 근거로 수정됨, EXP-10.md 참고)인데 여긴 그때 같이 안 고쳐져서
# 300으로 남아있었음(2026-07-29 발견 - Transport 200demo 재학습 중 eval이 매번 handoff 완료
# 전에 타임아웃돼 success_rate=0.000이 4번 연속 나옴). round.yaml과 맞춤.
eval_max_steps: 1000

# OpenVLA(runner_name=openvla_trainer) 전용 — DiffusionTrainer는 무시.
max_steps: 3000
grad_accumulation_steps: 8
save_every: 250

# 가중치 학습(옵션) — round.py가 배포+개입으로 모은 데이터(action_mode 라벨 포함)를 학습할 때
# 켠다. kind=null이면 기존처럼 비가중 BC/DiffusionPolicy. class_based=SIRIUS 원문 4-class 고정
# 가중치, action_error=예측오차 기반 적응 가중치, rabc=SARM 논문(arXiv:2509.25358)의
# Reward-Aligned BC(progress-delta 기반, task에 stage_onehot 라벨이 hdf5에 있어야 함,
# label_stages.py로 미리 기록) — 셋 다 reference 모델 없는 단순 가중 손실(losses/sirius_loss.py)
# 로 적용. reference 모델+KTO가 필요하면 아래 system.kind=apo를 켤 것(weighting은 그대로 재사용).
weighting:
  kind: null  # null | class_based | action_error | rabc | phase_rule | action_variance | event_radius
  target_intv: 0.5       # class_based 전용(SIRIUS 원문 기본값)
  target_preintv: 0.002  # class_based 전용
  beta_d: 1.0             # action_error 전용
  beta_u: 1.0
  gamma: 1.0
  kappa: auto              # rabc 전용 — "이미 충분히 좋은 진행" 임계값. "auto"면 이 데이터셋의
  # 실측 delta_mean으로 자동 설정(2026-07-22 수정, RABCWeight 참고) — 고정값 0.01(SARM 논문
  # 기본값)을 그대로 쓰면 episode 길이/chunk_size 비율이 다른 task에서 대부분 chunk가
  # weight=1로 포화돼 변별력을 잃음(Transport 실측: 76% 포화). 숫자를 직접 주면 그대로 씀.
  epsilon: 1.0e-6          # rabc 전용, 분모 안정화
  progress_path: null      # rabc 전용, null이면 heuristic stage_progress() 직접 계산.
  # scripts/compute_sarm_progress.py로 만든 npz 경로를 주면 학습된 SARM reward model의
  # 예측 progress를 씀(lerobot 실제 파이프라인과 동일 구조).
  critical_weight: 3.0     # phase_rule/event_radius 공용 — critical_stages(진입)에 곱할 가중치
  critical_stages: [3]     # phase_rule/event_radius 공용, Transport 기본값=payload_handoff(2026-07-21
  # trash_delivered 제거로 5단계로 축소되며 인덱스 4→3, STAGE_NAMES_TRANSPORT 참고)
  radius: 20               # event_radius 전용 — critical stage 진입 시점 ±radius 프레임만 가중치
  # (STAIR Eq.2 스타일. phase_rule은 critical stage 전체 구간에 가중치 — 이 둘을 별도 arm으로
  # 비교하기 위해 나눔, 2026-07-22)
  variance_path: null      # action_variance 전용 — scripts/compute_action_variance.py로 만든 npz 경로
  w_min: 0.2               # action_variance 전용, 가중치 clip 하한
  w_max: 5.0               # action_variance 전용, 가중치 clip 상한

# system 축(2026-07-27 추가) — loss 구조. null이면 위 weighting만으로 학습(=SIRIUS 스타일,
# reference 모델 없음, 기존 동작 그대로). apo면 reference 모델 + KTO 앵커(losses/apo_loss.py,
# policies/diffusion/apo_system.py) — weighting 축과 독립이라 system=apo + weighting.kind=
# class_based 같은 조합도 가능(2026-07-16(4) 3축 독립 설계 그대로 계승).
system:
  kind: null  # null | apo
  beta: 1.0               # 2026-07-27 밤 실측 스모크 테스트로 재조정(과거 1000은 Diffusion-KTO
                           # 논문 자체 값(beta=5000, arXiv:2404.04465 Appendix A.1)과도 다른,
                           # 근거가 약한 값이었음 - 확인 없이 옮겨적은 것으로 보임). 우리 reward는
                           # 16스텝 MSE 차이 합산이라 스케일 자체가 다르므로, 값을 그대로 베낄 게
                           # 아니라 실측(|beta*(reward-z0)| 중앙값 0.5~2)으로 우리 데이터에서
                           # 직접 잡아야 함 - beta=1.0이 round0 데이터에서 이 기준을 만족했음.
  z0_method: match  # match(기본) | mismatch. 근거는 apo_system.py 모듈 docstring 참고 —
                     # diffusion-kto 공식 코드 기본값(bce_offset=none)과 동일하게 match를 먼저
                     # 실험하고 mismatch와 비교(EXP-10.md 2026-07-30 절). [결정 대기 — 실험 결과로 채울 것]
  desirable_weight: 1.0
  undesirable_weight: 3.0  # 2026-07-30: 배치비율을 APO 원문 3:1로 되돌리며 같이 조정(아래
                           # sampler_target_*). KTO Eq.9(`λD·nD/(λU·nU)∈[1,4/3]`)를 nD:nU=3:1에
                           # 대입하면 undesirable_weight∈[2,3](desirable=1 기준) — 3이면 비율=1
                           # (가장 타이트). `raw_weight_sum_chosen/rejected` 로그로 실측 확인 후
                           # 조정할 것. [결정 대기 — 실험 결과로 채울 것]
  preference_frames: 8    # receding-horizon으로 실제 실행되는 앞 8프레임(pred_horizon=16 중)의
                           # 평균 부호로 desirable/undesirable 판정.
  sampler_kind: weighted  # weighted(기본, WeightedRandomSampler, "1epoch=len(dataset)" 고정) |
                          # interaction_exhaustion(2026-08-05 추가, 원문처럼 "1epoch=interaction
                          # 소진 시점" — round2처럼 interaction 수가 round1보다 적은 라운드에서
                          # "전체 데이터 비례" 학습량 산정이 맞는지 의문이 제기돼 추가. apo_sampler.py
                          # 참고, EXP-10.md 2026-08-04/05 절. [검증 대기, 아직 실제 학습에 안 써봄]
  sampler_target_correct: 0.5      # 2026-07-30: APO 원문 값(0.5/0.25/0.25 → desirable:undesirable=3:1)
  sampler_target_interaction: 0.25 # 으로 복원 — 7차가 1:1로 바꾼 근거(KTO Eq.9)는 desirable_weight=
  sampler_target_incorrect: 0.25   # undesirable_weight=1(flat) 가정이었는데, 그룹가중치 정규화 버그가
                                    # 이미 fix된 지금은 undesirable_weight(위)로 별도 보정 가능 — "3:1+
                                    # 그룹가중치정규화+weight 보정" 조합은 7~10차에 한 번도 없었음.
                                    # 근거: EXP-10.md 2026-07-30 절. [결정 대기 — 실험 결과로 채울 것]
  reference_ema_enabled: false  # APO·Diffusion-KTO 둘 다 기본값이 reference 고정. 근거: EXP-10.md "6차 시도" 절.
  reference_ema_momentum: 0.999  # enabled=true일 때만 의미 있음(디버깅/재실험용으로 남겨둠).
  reference_ema_every: 20
  z0_clamp_min: -50.0  # z0 anchor clamp 범위(APO 원문 방식, 대칭). 근거: EXP-10.md "z0 clamp" 절.
  z0_clamp_max: 50.0
  use_lora: true  # 2026-07-30: 초기 구현부터 LoRA를 표준 경로로 채택(APO 원문도 항상 true) —
                   # 기존엔 기본값 false라 override 안 하면 조용히 비-LoRA(6차 이전과 같은 실패
                   # 조건)로 재현되는 함정이 있었음, 그래서 기본값 자체를 바꿈.
  lora_rank: 32    # APO 원문 값(논문 4.1절, "rank r=32").
  lora_alpha: 16   # 2026-07-30: 32→16. 논문 본문엔 alpha 언급 없음(rank=32만 명시) — 실제 공개
                    # 코드(sft_train.py:160, `lora_alpha=min(cfg.lora_rank, 16)`)가 alpha=16으로
                    # 학습·보고했고 이 어댑터를 APO 단계가 그대로 이어받아 씀[검증-코드, 2026-07-30].
  bc_aux_weight: 0.0  # 원문엔 없는 항(기본 0=꺼짐). KTO sigmoid가 이미 reward>z0인 desirable
                       # 샘플에서 saturate돼 보호 gradient가 없다는 걸 round0에서 실측 확인
                       # (base가 잘하던 reach가 8회 시도 전부에서 무너짐, weighting 축 유무와
                       # 무관) — desirable 샘플에 표준 noise-MSE loss를 더해 saturate돼도
                       # "이 행동을 계속 재현하라"는 gradient가 남게 함. 근거: EXP-10.md.
  ars_enabled: false  # 2026-07-30 추가, 원문엔 없는 항(기본 꺼짐) — Adaptive Rejection Scaling.
                       # arXiv:2511.19049(Beyond Reward Margin) 근거: chosen과 구별하기 어려운
                       # rejected 샘플(z0에 가까움)일수록 그 gradient가 chosen 쪽으로 번져
                       # (spillover) chosen 품질까지 깎아먹는다 — 우리 PREINTV(rejected)가
                       # DEMO/ROLLOUT(chosen) 바로 직전 프레임이라 정확히 이 최악 조건에
                       # 해당할 수 있다는 가설(round1 mismatch 붕괴 관측 이후). 근거: EXP-10.md
                       # 2026-07-30 저녁 절. losses/apo_loss.py 모듈 docstring 참고.
  ars_k1: 1.0    # PG-DPO 원문 Eq.7의 K1(sigmoid 안 스케일). beta처럼 실측 재조정 필요.
  ars_eps: 1.0e-4  # 원문 eps — 분모(|rejected_reward|) 0 나눗셈 방지용, action_error.py의
                    # eps 관례와 동일 크기.
  ars_ratio_clip: 10.0  # 2026-08-05 추가 — sigmoid 적용 전 ars_ratio를 [-clip,clip]으로
                    # clamp. |rejected_reward|가 0 근처(=chosen과 가장 구별 어려운, 안전장치가
                    # 가장 필요한 경우)일 때 ratio가 폭주해 sigmoid가 극단(0/1)으로 튀는 걸
                    # 방지(MADPO, arXiv:2510.05342의 piecewise cap 방식). losses/apo_loss.py
                    # 모듈 docstring 참고.
  action_error_source: noise_mse  # noise_mse(기본) | x0_l1. weighting(action_error 축)에
                       # 넘길 "오차"의 정의. APO 원문은 reward(토큰 log확률)와 weight(디코딩된
                       # 연속 액션 L1)를 의도적으로 다른 양으로 쓴다(논문 4.2절). x0_l1은 그
                       # 대응물(노이즈 예측에서 복원한 액션의 GT 대비 L1)이나, x0오차 =
                       # sqrt((1-abar_t)/abar_t) x 노이즈오차 항등식 때문에 timestep 편향을
                       # 오히려 크게 끌어들인다(계수가 t=5에서 0.106, t=95에서 16.02) —
                       # weight_ref_timestep이 같은 문제를 더 직접 해결하므로 기본값 유지.
                       # 근거: EXP-10.md 2026-07-31 절, apo_system.py 해당 분기 주석.
  weight_ref_timestep: null  # null(기본, 기존 동작) | 정수 t. adaptive weight를 계산할 때
                       # 쓸 고정 기준 timestep. null이면 학습 손실과 같은 샘플별 랜덤 t를
                       # 그대로 쓴다. 문제: 가중치는 배치 내 샘플 오차의 상대 순위로 작동하는데
                       # 샘플마다 t가 랜덤이라 오차 분산의 79%를 timestep이 설명하고, 진짜
                       # 샘플 난이도와의 순위 상관은 0.46에 그친다[검증-실측]. 반면 서로 다른
                       # 고정 t에서 잰 난이도끼리는 상관 0.73~0.92로 일관 — 신호는 실재하나
                       # 잡음에 묻혀 있다. 값을 주면 가중치만 그 t에서 별도 no_grad forward로
                       # 계산한다(학습 손실은 표준 DDPM대로 랜덤 t 유지 — gradient 분산 이점 보존).
  encoder_lr_scale: 0.0  # 0.0(기본, 기존 동작=완전 동결) | 0보다 크면 use_lora=true여도
                       # policy.encoders(비전 인코더)를 학습 가능하게 풀고, 이 값을 base lr에
                       # 곱한 lr로 별도 파라미터 그룹을 만든다(diffusion_trainer.py). 근거는
                       # apo_system.py ApoSystem 클래스 docstring 참고 — round1에서 인코더
                       # 동결 상태로는 손실 형태·undesirable_weight를 뭘 바꿔도 base를 못
                       # 넘었고 전부 epoch에 따라 단조 악화했다. Diffusion Policy 문헌은
                       # 인코더를 정책 네트워크의 1/10 lr로 함께 학습하는 걸 최선으로
                       # 보고한다[문헌] — 그래서 기본 스케일도 0.1을 권장값으로 적어둔다
                       # (기본값 자체는 하위호환을 위해 0.0).
  encoder_lora: false  # false(기본, 하위호환) | true면 encoder_lr_scale>0일 때 인코더를
                       # full fine-tune 대신 UNet과 같은 LoRA(저랭크 제약)로 연다. 근거:
                       # encoder_lr_scale 주석 및 apo_system.py ApoSystem docstring —
                       # full fine-tune으로 이동량을 키울수록(scale 0.1->1.0) 오히려 성공률이
                       # 떨어지는 패턴이 나와, "제약 없는 자유도" 자체가 원인일 수 있다는
                       # 가설을 검증하기 위함(2026-08-01).

# 직전 라운드 체크포인트 경로. system=apo일 때 policy를 여기서 warm-start하고 reference를
# 그 시점에서 복제한다(round.py가 배포에 쓴 체크포인트를 그대로 넘김 — APO 원문의
# policy/reference가 같은 vla_path에서 출발하는 것과 동일). null이면 scratch(reference도
# 무작위 초기화 정책의 복제 — 의미는 약하지만 죽지는 않음).
init_from: null
inherit_init_stats: true  # 2026-07-31 추가. init_from이 있으면 그 체크포인트 옆의
                          # normalization_stats.json을 그대로 쓴다(없으면 경고 후 새로 계산).
                          # 여태 무조건 학습 데이터로 새로 계산했는데, 파인튜닝에서 이건 틀린
                          # 동작이다 — 불러온 가중치가 원래 통계에 맞춰져 있으므로 통계를
                          # 바꾸면 같은 물리값이 다른 정규화값으로 들어간다(실측: base 가중치
                          # 고정, 통계만 demo50->merged 교체로 demo 재현 L1 +28.4%, 최대 이동은
                          # eef_quat[3]에서 0.650). 과거 동작을 재현하려면 false로 끌 것.

resume: false
# manipulation_pipeline 컨벤션(outputs/<task>/<model>/<session>)을 그대로 따름 — <session>은
# 학습 시작 시각(2026-07-25 리팩터). resume=true로 이어가려면 이 output_dir을 그대로
# 다시 지정해야 한다(새로 실행하면 새 시각 폴더가 생겨 다른 세션이 됨 — 오늘 기본값을
# 새로 만들 때만 편하고 이어갈 땐 원래도 output_dir을 그대로 다시 줘야 했던 것과 동일한
# 부담, resume 자체가 새로 깨지는 건 아님).
output_dir: outputs/${task.name}/${policy.name}/${now:%Y%m%d-%H%M%S}
device: cuda
use_wandb: false
wandb_project: mani_sim
wandb_run_name: null  # null이면 "{task}_{policy_name}" 기본값
wandb_group: null
wandb_tags: []

# hydra 자체 로그/설정 스냅샷(.hydra/)도 같은 폴더에 쌓아 체크포인트와 분리되지 않게 한다
# (전엔 outputs/<날짜>/<시각>/에 따로 생겼음 — hydra는 cwd는 안 바꾸므로(확인함, 2026-07-25)
# data/ 상대경로 등엔 영향 없음).
hydra:
  run:
    dir: ${output_dir}
